# ============================================================================
# Livelihood Zones (For Contextual Feature Engineering)
# ============================================================================
# Used in displacement and economic models to condition feature elasticities.

livelihood_zones:
  agropastoral_gedo_bakool:
    name: "Agropastoral (Gedo, Bakool, Bay)"
    districts: ["Gedo", "Bakool", "Bay"]
    main_activities: ["rainfed agriculture", "pastoralism"]
    flood_vulnerability: "High"
    drought_vulnerability: "High"
    displacement_base_rate: null
    
  riverine_shabelle_juba:
    name: "Riverine/Agricultural (Shabelle, Juba)"
    districts: ["Hiiraan", "Middle Shabelle", "Lower Shabelle", "Lower Juba"]
    main_activities: ["irrigated agriculture", "flood-recession agriculture"]
    flood_vulnerability: "Very High"
    drought_vulnerability: "Low to Moderate"
    displacement_base_rate: null
    
  pastoral_central_northern:
    name: "Pastoral (Central/Northern ranges)"
    districts: ["Togdheer", "Sool", "Sanaag", "Bari", "Awdal", "Woqooyi Galbeed"]
    main_activities: ["pastoralism"]
    flood_vulnerability: "Low (flash flood risk in high-rain years)"
    drought_vulnerability: "Extreme"
    displacement_base_rate: null
    note: "No gauge network. Not covered by Tier 3."
    
  urban_informal:
    name: "Urban Informal Settlements"
    main_cities: ["Mogadishu", "Baidoa", "Kismayo"]
    main_activities: ["informal trade", "casual labor"]
    flood_vulnerability: "Moderate to High (inadequate drainage)"
    drought_vulnerability: "High (depends on food market)"
    displacement_base_rate: null

# ============================================================================
# Terrain and Infiltration Characteristics
# ============================================================================
# For AMC classification and runoff modelling (SCS curve number).

soil_types:
  # AMC-I treatment INVERTED on semi-arid soils
  crusted_semi_arid:
    description: "Crusted, desiccated soil (after 4+ failed seasons)"
    region: "Widespread Somalia 2022-2026"
    infiltration_rate_mm_per_hour: 5  # Low infiltration
    scs_curve_number_amc_i: 80  # HIGH curve number (inverted!)
    scs_curve_number_amc_ii: 70
    scs_curve_number_amc_iii: 85
    physical_motivation: |
      Standard SCS was calibrated on temperate agricultural soils where dry means
      higher infiltration. On crusted semi-arid soils the relationship reverses:
      a long dry spell raises the effective curve number. Consistent with observed
      2023 flash flood behavior. **No Somalia-specific calibration confirmed.**
    note: "Label clearly in code and output as modelling judgement."
    
  normal_soil:
    description: "Soil with normal moisture history"
    infiltration_rate_mm_per_hour: 15
    scs_curve_number_amc_i: 60
    scs_curve_number_amc_ii: 70
    scs_curve_number_amc_iii: 80

# ============================================================================
# Administrative Boundaries (For Panel Assembly)
# ============================================================================
# Used to define the district-month matrix for training data.

administrative_levels:
  level_1:
    name: "Region"
    examples: ["Bay", "Bakool", "Gedo", "Hiiraan", "Middle Shabelle", "Lower Shabelle", "Lower Juba"]
    
  level_2:
    name: "District"
    note: "PRMN and HDX data are typically at district resolution."
    
  level_3:
    name: "Sub-district/IDP settlement"
    note: "Site-level data available from CCCM. Not used in first model iteration."

# ============================================================================
# Known Data Gaps and Placeholders
# ============================================================================

data_gaps:
  gauge_thresholds:
    status: "ALL NULL"
    note: |
      All high-risk level thresholds at FRRIMS stations are null pending
      official FRRIMS station metadata release. Confirm the high-risk level
      matches the SoDMA action trigger exactly.
    
  catchment_polygons:
    status: "PLACEHOLDER BBOXES ONLY"
    note: |
      Current catchment definitions are bounding boxes. Replace with HydroSHEDS
      basin polygons. A bbox over the Bale highlands includes terrain that does
      not drain to the Shabelle.
      
      See: https://www.hydrosheds.org/
    
  idp_population_current:
    status: "REQUIRES LIVE QUERY"
    note: |
      Standing IDP population at each settlement must be queried from HAPI
      or CCCM at runtime. Use fixture values for testing only.
