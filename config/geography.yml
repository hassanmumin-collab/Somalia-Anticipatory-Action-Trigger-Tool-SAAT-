# SAAT Geography Configuration
# Gauges, routing lags, catchment definitions, livelihood zones

version: 1.0
date_created: 2026-08-31

# ============================================================================
# Riverine Gauges and Routing Lags
# ============================================================================
# These towns flood from rainfall in the Ethiopian highlands, not local rainfall.
# Routing lag is the tool's single largest source of usable lead time.
# Ignoring it is the most common structural error in Somalia flood models.

river_systems:
  shabelle:
    name: "Shabelle River"
    source_region: "Ethiopian Highlands (Bale, Arsi)"
    receiving_region: "Southern Somalia (Middle Shabelle, Lower Shabelle)"
    length_km: 2250
    main_stations:
      belet_weyne:
        coordinates: [5.21, 46.30]
        admin_region: "Hiiraan"
        population_risk: 200000
        routing_lag_days: 4
        upstream_catchment_area_km2: null  # Placeholder - use HydroSHEDS
        high_risk_level_m: null  # Placeholder - confirm from SoDMA
        
      bulo_burti:
        coordinates: [5.95, 45.28]
        admin_region: "Hiiraan"
        population_risk: 50000
        routing_lag_days: 4
        upstream_catchment_area_km2: null
        high_risk_level_m: null
        
      jowhar:
        coordinates: [5.57, 46.41]
        admin_region: "Middle Shabelle"
        population_risk: 150000
        routing_lag_days: 4
        upstream_catchment_area_km2: null
        high_risk_level_m: null
        
      afgooye:
        coordinates: [2.93, 45.53]
        admin_region: "Lower Shabelle"
        population_risk: 100000
        routing_lag_days: 4
        upstream_catchment_area_km2: null
        high_risk_level_m: null
        note: "Lower Shabelle is rarely in high-risk window. Verify."
        
  juba:
    name: "Juba River"
    source_region: "Ethiopian Highlands (Bale, Borana Highlands)"
    receiving_region: "Southern Somalia (Lower Juba, Bay/Bakool)"
    length_km: 1500
    main_stations:
      doolow:
        coordinates: [4.41, 42.59]
        admin_region: "Gedo"
        population_risk: 80000
        idp_settlements: ["Doolow IDP settlement"]
        routing_lag_days: 6
        upstream_catchment_area_km2: null  # Placeholder
        high_risk_level_m: null  # Placeholder - confirm from SoDMA
        
      luuq:
        coordinates: [3.74, 43.10]
        admin_region: "Gedo"
        population_risk: 60000
        routing_lag_days: 6
        upstream_catchment_area_km2: null
        high_risk_level_m: null
        
      bardheere:
        coordinates: [1.54, 41.84]
        admin_region: "Bay"
        population_risk: 40000
        routing_lag_days: 6
        upstream_catchment_area_km2: null
        high_risk_level_m: null

# ============================================================================
# Catchment Definitions for Rainfall Accumulation
# ============================================================================
# Use upstream rainfall as primary predictor (not local rainfall).
# Currently bounding boxes; should be replaced with HydroSHEDS basin polygons.

catchments:
  shabelle_upstream:
    name: "Shabelle Upstream (Ethiopian Highlands)"
    bbox:
      north: 10.5
      south: 7.0
      east: 44.0
      west: 41.0
    note: |
      PLACEHOLDER BBOX. Replace with HydroSHEDS basin polygon for 3 main tributaries:
      1. Genale (Dawa) - feeds southern Shabelle
      2. Web - feeds central Shabelle
      3. Weyb - feeds central Shabelle
    target_stations: ["belet_weyne", "bulo_burti", "jowhar", "afgooye"]
    
  juba_upstream:
    name: "Juba Upstream (Ethiopian Highlands)"
    bbox:
      north: 9.0
      south: 5.0
      east: 44.0
      west: 40.5
    note: |
      PLACEHOLDER BBOX. Replace with HydroSHEDS basin polygon. Main sources:
      1. Borana Highland tributaries
      2. Omo-Turkana tributaries (transboundary)
    target_stations: ["doolow", "luuq", "bardheere"]

# Which admin-1 regions drain from which upstream catchment. Used to attach the
# upstream Ethiopian-highland rainfall feature to riverine districts in the
# district-month panel. Regions not listed have no gauged upstream catchment
# (is_riverine = false); their flood pathway is flash / rain-fed, not routed.
# PLACEHOLDER mapping at admin-1 resolution: refine to the actual riverine
# districts once HydroSHEDS basin polygons replace the bboxes above.
river_basin_regions:
  shabelle_upstream: ["Hiiraan", "Middle Shabelle", "Lower Shabelle"]
  juba_upstream: ["Gedo", "Middle Juba", "Lower Juba", "Bay"]

# PRMN district name -> COD som_admin2 name, where they differ beyond fuzzy
# tolerance. Used to attach CHIRPS centroid rainfall to the right district.
district_name_aliases:
  Baidoa: "Baydhaba"

# Approximate centroids (lat, lon) for panel districts absent from the COD
# admin-2 layer (contested / re-districted areas, or Banadir which PRMN treats as
# one district). PLACEHOLDER coordinates - refine against an authoritative
# gazetteer. None of these are riverine.
district_extra_centroids:
  Banadir: [2.05, 45.34]    # central Mogadishu
  Badhan: [10.72, 48.33]    # Sanaag
  Dhahar: [9.50, 48.50]     # Bari/Sanaag border

