[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "saat"
version = "0.1.0"
description = "Somalia Anticipatory Action Trigger tool: flood forecasts to pre-agreed financing triggers with displacement caseload forecasting and monetised economic loss"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "SAAT Team", email = "saat@example.com"}
]
license = {text = "MIT"}
keywords = ["somalia", "anticipatory-action", "flood", "trigger", "forecast"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "lightgbm>=4.0.0",
    "requests>=2.31.0",
    "cdsapi>=0.7.7",
    "rasterio>=1.3.0",
    "xarray>=2023.0.0",
    "netcdf4>=1.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.0.280",
    "mypy>=1.4.0",
    "jupyter>=1.0.0",
    "ipython>=8.14.0",
]
full = [
    "saat[dev]",
    "geopandas>=0.13.0",
    "folium>=0.14.0",
    "plotly>=5.16.0",
    "scikit-learn>=1.3.0",
]

[project.scripts]
saat = "saat.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages]
find = {where = ["src"]}

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--verbose --cov=src/saat --cov-report=term-missing"

[tool.black]
line-length = 100
target-version = ["py310"]
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W", "I", "N"]
ignore = ["E501"]  # black handles line length
exclude = [".git", "__pycache__", "build", "dist"]

[tool.mypy]
python_version = "3.10"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
